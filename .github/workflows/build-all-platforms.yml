name: Build Multi-Platform Application

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Build Web (Next.js)
        run: |
          cd web
          npm run build
        env:
          OPENAI_API_KEY: "dummy-key-for-build"
          DATABASE_URL: "file:./dev.db"

      - name: Install Gateway Dependencies
        run: |
          cd ai-gateway
          npm install

      - name: Build Gateway
        run: |
          cd ai-gateway
          npx tsc

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Desktop Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd desktop
          npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Desktop Executable (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          cd desktop
          npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: viral-shorts-engine-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/*.yml
          retention-days: 1

      - name: Upload Mac Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: viral-shorts-engine-mac
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.zip.blockmap
            desktop/release/*.yml
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: viral-shorts-engine-windows
          path: release-assets
          
      - name: Download Mac Artifacts
        uses: actions/download-artifact@v4
        with:
          name: viral-shorts-engine-mac
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
